publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^11.2.0
  socket_io_client: ^3.1.2
  google_maps_flutter: ^2.18.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
